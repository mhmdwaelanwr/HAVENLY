<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Discover homes across Egypt, save your favorites and compare properties with HAVENLY." />
    <title>HAVENLY | Find Your Place</title>
    <link rel="icon" type="image/svg+xml" href="/src/assets/havenly-logo.svg" />
    <script>
      try {
        const saved = localStorage.getItem("havenly-theme");
        document.documentElement.dataset.theme =
          saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
